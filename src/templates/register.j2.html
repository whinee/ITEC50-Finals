{% extends 'base.j2.html' %}
{% block head %}
    <link href="/static/stylesheets/base.css" rel="stylesheet">
    <link href="/static/stylesheets/responsive-base.css" rel="stylesheet">
    <link href="/static/stylesheets/forms.css" rel="stylesheet">
{% endblock head %}
{% block body %}
    {# Flashing message start here #}
    {% for message in fetch_flash(request) %}
        <div class="{{ message.category }}">{{ message.message }}</div>
    {% endfor %}
    {# Flashing message ends here #}
    <div id="wrapper">
        <main>
            <div class="inner">
                <form action="/auth/register" method="POST">
                    <label for="username">Username:</label><br><br>
                    <div class="form-box">
                        <input class="input" type="text"
                            placeholder="@<username>"
                            class="form" required>
                        <btn class="icon1" class="erase-input" style="visibility: hidden;">×</btn>
                    </div><br><br>

                    <label for="email">Email:</label><br><br>
                    <div class="form-box">
                        <input class="input" type="text"
                            placeholder="you@example.com"
                            class="form" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" required>
                        <btn class="icon1" class="erase-input" style="visibility: hidden;">×</btn>
                    </div><br><br>
                </form>
            </div>
        </main>
    </div>
{% endblock body %}
