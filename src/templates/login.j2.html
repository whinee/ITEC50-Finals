{% extends 'base.j2.html' %}
{% block head %}
    <link href="/static/stylesheets/base.css" rel="stylesheet">
    <link href="/static/stylesheets/responsive-base.css" rel="stylesheet">
    <link href="/static/stylesheets/forms.css" rel="stylesheet">
{% endblock head %}
{% block body %}
    <div id="wrapper">
        <main>
            <div class="inner">
                <form id="login-form" method="post">
                    <table>
                        <tr>
                            <td>Username</td>
                            <td>
                                <input type="text" name="username" id="username">
                            </td>
                        </tr>
                        <tr>
                            <td>Password</td>
                            <td>
                                <input type="password" name="password" id="password">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="submit" value="Login" type="button">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch("/auth/login", {
                method: "POST",
                body: new URLSearchParams(formData), // sends as form-encoded
            });

            const data = await res.json();
            toast({
                title: data.error ? "Error" : "Success",
                message: data.message,
                type: data.error ? "error" : "success",
            });

            if (res.ok) {
                setTimeout(() => window.location.href = "/", 1000);
            }
        });
    </script>
{% endblock body %}
