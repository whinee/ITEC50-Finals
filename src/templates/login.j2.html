{% extends 'base.j2.html' %}
{% block head %}
    <link href="/static/stylesheets/forms.css" rel="stylesheet">
{% endblock head %}
{% block body %}
    <div id="wrapper">
        <main>
            <div class="inner">
                <div class="form-header">
                    <h1 class="form-header-title">DeciMark</h1>
                    {% if splash %}<p class="form-splash">{{ splash }}</p>{% endif %}
                </div>
                <form id="login-form" method="post">
                    <div class="field">
                        <label for="identifier">Username/E-mail</label>
                        <div class="form-box form-field-margin">
                            <input class="input" name="identifier" type="text" placeholder="" required>
                            <button type="button" class="icon1 erase-input hide">×</button>
                        </div>
                        <!-- <div class="validation-msg"></div> -->
                    </div>
                    <div class="field form-field-margin">
                        <label for="password">Password</label>
                        <div class="form-box form-field-margin">
                            <input class="input" name="password" type="password" placeholder="" required>
                            <button type="button"
                                    class="icon1 toggle-password toggle-password-btn"
                                    title="Toggle Password Visibility">👁</button>
                            <button type="button" class="icon1 erase-input hide">×</button>
                        </div>
                        <!-- <div class="validation-msg"></div> -->
                    </div>
                    <div class="field form-field-margin">
                        <label for="captcha_answer">Captcha</label>
                        <div class="captcha-img-wrapper">
                            <img id="captcha-img" src="" class="captcha-img">
                        </div>
                        <div class="captcha-reload-wrapper">
                            <button type="button"
                                    id="reload-captcha"
                                    class="pill styled-button captcha-reload-btn">
                                Reload Captcha
                            </button>
                        </div>
                        <div class="form-box form-field-margin">
                            <input class="input"
                                   name="captcha_answer"
                                   type="text"
                                   placeholder="Enter captcha code"
                                   required>
                            <button type="button" class="icon1 erase-input hide">×</button>
                        </div>
                    </div>
                    <br>
                    <div class="demo-login-group">
                        <input type="submit" value="Login" class="styled-button">
                        <button type="button"
                                id="demo-login-btn"
                                class="styled-button demo-login-btn">
                            Demo Login
                        </button>
                    </div>
                </form>
                <br>
                <div class="oauth-btn-group">
                    {% if settings.OAUTH.GOOGLE.ENABLE %}
                        <a href="/auth/oauth/google" class="button oauth-btn oauth-btn-google">Login with Google</a>
                    {% endif %}
                    {% if settings.OAUTH.GITHUB.ENABLE %}
                        <a href="/auth/oauth/github" class="button oauth-btn oauth-btn-github">Login with GitHub</a>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>
    <script src="/static/scripts/forms.js">
        document.getElementById("demo-login-btn").addEventListener("click", async (e) => {
            e.preventDefault();
            const res = await fetch("/auth/demo", {
                method: "POST"
            });
            if (res.ok) {
                toast({
                    title: "Success",
                    message: "Logged in as demo user.",
                    type: "success"
                });
                setTimeout(() => window.location.href = "/bookmarks", 1000);
            } else {
                toast({
                    title: "Error",
                    message: "Demo login failed.",
                    type: "error"
                });
            }
        });
    </script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch("/auth/login", {
                method: "POST",
                body: new URLSearchParams(formData), // sends as form-encoded
            });

            if (res.status === 422) {
                toast({
                    title: "Error",
                    message: "Something went wrong.",
                    type: "error",
                });
            } else {
                console.log(res);
                const data = await res.json();
                toast({
                    title: data.error ? "Error" : "Success",
                    message: data.message,
                    type: data.error ? "error" : "success",
                });
            }

            if (res.ok) {
                console.log("FUCKING HELL!");
                setTimeout(() => window.location.href = "/bookmarks", 1000);
            }
        });

        document.getElementById("demo-login-btn").addEventListener("click", async (e) => {
            e.preventDefault();
            const btn = e.currentTarget;
            if (btn.disabled) return;

            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';

            toast({
                title: "Working...",
                message: "Provisioning demo account and seeding ~10,000 bookmarks. This may take a few seconds...",
                type: "info",
                duration: 5000
            });

            try {
                const res = await fetch("/auth/demo", {
                    method: "POST"
                });

                if (res.ok) {
                    toast({
                        title: "Success",
                        message: "Logged in as demo user.",
                        type: "success"
                    });
                    setTimeout(() => window.location.href = "/bookmarks", 1000);
                } else {
                    toast({
                        title: "Error",
                        message: "Demo login failed.",
                        type: "error"
                    });
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                }
            } catch (err) {
                toast({
                    title: "Error",
                    message: "A network error occurred.",
                    type: "error"
                });
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        });
    </script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = btn.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🔒';
                } else {
                    input.type = 'password';
                    btn.textContent = '👁';
                }
            });
        });
    </script>
    <script>
        async function loadCaptcha() {
            const img = document.getElementById('captcha-img');
            img.style.opacity = '0.5';
            const res = await fetch("/auth/captcha");
            if (res.ok) {
                const data = await res.json();
                img.src = data.image;
                img.style.opacity = '1';
            }
        }
        document.addEventListener('DOMContentLoaded', loadCaptcha);
        document.getElementById('reload-captcha')?.addEventListener('click', loadCaptcha);
    </script>
{% endblock body %}
