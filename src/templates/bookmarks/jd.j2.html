{% extends 'base.j2.html' %}
{% block head %}
    <link href="/static/stylesheets/bookmarks.css" rel="stylesheet">
{% endblock head %}
{% block body %}
    <div id="wrapper">
        <main class="bookmarks-shell" data-bookmarks-page="jd">
            <nav class="bookmark-nav" aria-label="Bookmark navigation">
                <a href="/bookmarks/dashboard">Dashboard</a>
                <a href="/bookmarks/add">Add</a>
                <a href="/bookmarks/search">Search</a>
            </nav>
            <section class="bookmark-header">
                <div>
                    <p class="eyebrow">JD ID View</p>
                    <h1 id="view-title">Bookmarks by JD ID</h1>
                </div>
            </section>
            <form id="jd-filter-form" class="inline-search">
                <input id="jd-filter-input"
                       name="jdId"
                       type="text"
                       placeholder="Enter JD ID"
                       required>
                <button type="submit" class="bookmark-action">Load</button>
            </form>
            <section id="jd-results" class="bookmark-list wide">
            </section>
        </main>
    </div>
    <script src="/static/scripts/bookmarks.js" defer></script>
{% endblock body %}
