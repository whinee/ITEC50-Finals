{% extends 'base.j2.html' %}
{% block head %}
    <link href="/static/stylesheets/bookmarks.css" rel="stylesheet">
{% endblock head %}
{% block body %}
    <div class="wrapper">
        <main class="bookmarks-shell" data-bookmarks-page="tag">
            <nav class="bookmark-nav" aria-label="Bookmark navigation">
                <a href="/bookmarks/dashboard">Dashboard</a>
                <a href="/bookmarks/add">Add</a>
                <a href="/bookmarks/search">Search</a>
            </nav>
            <section class="bookmark-header">
                <div>
                    <p class="eyebrow">Tag View</p>
                    <div class="view-header-group">
                        <h1 id="view-title" class="view-header-title">Bookmarks by tag</h1>
                        <div id="tag-color-container" class="tag-color-container">
                            <input type="color"
                                   id="tag-color-picker"
                                   class="tag-color-picker"
                                   aria-label="Tag Color"
                                   title="Tag Color">
                            <button id="save-tag-color" class="styled-button save-tag-btn">Save Color</button>
                        </div>
                    </div>
                </div>
            </section>
            <form id="tag-filter-form" class="inline-search">
                <input id="tag-filter-input"
                       name="tag"
                       type="text"
                       placeholder="Enter tag"
                       aria-label="Enter tag"
                       title="Enter tag"
                       required>
                <button type="submit" class="bookmark-action">Load</button>
            </form>
            <section id="tag-results" class="bookmark-list wide">
            </section>
        </main>
    </div>
    <script src="/static/scripts/bookmarks.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tagParam = urlParams.get('tag');
            const colorContainer = document.getElementById('tag-color-container');
            const colorPicker = document.getElementById('tag-color-picker');
            const saveBtn = document.getElementById('save-tag-color');

            if (tagParam) {
                // Poll until TagColorMap is populated by bookmarks.js
                const checkInterval = setInterval(() => {
                    if (window.TagColorMap && window.TagColorMap.size > 0) {
                        clearInterval(checkInterval);
                        const tagInfo = window.TagColorMap.get(tagParam.toLowerCase());
                        if (tagInfo) {
                            colorContainer.style.display = 'inline-flex';
                            colorPicker.value = tagInfo.color;

                            saveBtn.addEventListener('click', async () => {
                                const newColor = colorPicker.value;
                                const res = await fetch(`/api/tags/${tagInfo.id}`, {
                                    method: 'PATCH',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        color: newColor
                                    })
                                });

                                if (res.ok) {
                                    if (window.toast) {
                                        toast({
                                            title: "Success",
                                            message: "Tag color updated!",
                                            type: "success"
                                        });
                                    }
                                    window.TagColorMap.set(tagParam.toLowerCase(), {
                                        ...tagInfo,
                                        color: newColor
                                    });
                                    // Wait for toast to display before reloading
                                    setTimeout(() => {
                                        location.reload();
                                    }, 1500);
                                } else {
                                    if (window.toast) {
                                        toast({
                                            title: "Error",
                                            message: "Failed to update color.",
                                            type: "error"
                                        });
                                    }
                                }
                            });
                        }
                    }
                }, 100);

                // Stop polling after 5 seconds
                setTimeout(() => clearInterval(checkInterval), 5000);
            }
        });
    </script>
{% endblock body %}
