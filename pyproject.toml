[project]
name = "src"
version = "1.0.0"
description = ""
authors = [{ name = "Lyra Phasma" }]
requires-python = ">=3.13,<3.14"

dependencies = [
    "rich>=13.3.5",
    "bcrypt>=4.1.2",
    "email-validator>=2.1.0.post1",
    "itsdangerous>=2.1.2",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.6",
    "ujson>=5.9.0",
    "alltheutils>=2.2.0",
    "asyncpg>=0.31.0",
    "sqlmodel>=0.0.38",
    "psycopg2-binary>=2.9.12",
    "greenlet>=3.5.0",
    "jinja2==3.1.5",
    "fastapi>=0.136.1",
]
maintainers = [
    { name = "Lyra Phasma", email = "lyraphasma@gmail.com" },
]
keywords = ["utility"]
classifiers=[
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities"
]

[project.urls]
homepage = "https://github.com/whinee/lyra-on.top"
repository = "https://github.com/whinee/lyra-on.top"
documentation = "https://github.com/whinee/lyra-on.top/tree/main/docs"
"Bug Tracker" = "https://github.com/whinee/lyra-on.top/issues"


[dependency-groups]
dev = [
    "black>=25.1.0",
    "erdantic>=1.1.0.post1",
    "mypy>=1.15.0",
    "no-implicit-optional>=1.4",
    "pdoc3>=0.11.5",
    "pytest>=8.3.4",
    "pytest-md-report>=0.7.0",
    "rich>=13.9.4",
    "ruamel-yaml>=0.18.10",
    "ruff>=0.9.6",
    "translate-toolkit>=3.15.2",
    "hypercorn>=0.16.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "djlint>=1.34.1",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
include = ["alltheutils*", "alltheutils.cli*"]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.mypy]
disable_error_code = ["import", "attr-defined", "no-untyped-call"]

[tool.ruff]
line-length = 88

target-version = "py313"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    # "DTZ",
    "E",
    "F",
    "I",
    "INP",
    "N",
    "PIE",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "UP"
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "ANN",
    "B",
    "C4",
    "COM",
    "D",
    "E",
    "F",
    "I",
    "PIE",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "UP"
]
unfixable = []

ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "D203",
    "D212",
    "D401",
    "D406",
    "D407",
    "D417",
    "E501",
    "I002",
    "N812",
    "N818",
    "RET503",
    "S101",
    "UP007",
    "UP032",
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "pyenv",
    "venv",
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = false
